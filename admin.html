<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bubbles Car Spa - Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #111827;
        }

        header {
            background: #071a3d;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
        }

        .container {
            padding: 25px;
            max-width: 1200px;
            margin: auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        .booking {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .booking p {
            margin: 7px 0;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }
        /* Dashboard polish */

.container {
    padding-top: 35px;
}

#bookingCount {
    background: white;
    padding: 15px 20px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    display: inline-block;
    margin-bottom: 20px;
}

button {
    font-size: 15px;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
    opacity: 0.9;
}

.booking {
    border-left: 5px solid #0b63f6;
    transition: 0.2s;
}

.booking:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}
    </style>
</head>

<body>

    <header>
        <h1>🚗 Bubbles Car Spa</h1>
        <button onclick="window.location.href='index.html'"
    style="padding:10px 18px; border:none; border-radius:8px; background:white; color:#071a3d; font-weight:bold; cursor:pointer;">
    🚪 Back to Website
</button>
        <p>Admin Dashboard</p>
    </header>

    <div class="container">
        <div style="
    background: linear-gradient(135deg, #071a3d, #0b63f6);
    color: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 20px;
">
    <h2 style="margin: 0 0 8px;">Welcome, Admin 👋</h2>
    <p style="margin: 0; opacity: 0.9;">
        Manage your Bubbles Car Spa bookings here.
    </p>
</div>


        <h2>Bookings</h2>
        <p id="bookingCount" style="font-size:18px; font-weight:bold; color:#0b63f6;">
    Total Bookings: 0
</p>
        <button onclick="loadBookings()" style="padding:10px 18px; border:none; border-radius:8px; background:#0b63f6; color:white; cursor:pointer; margin-bottom:20px;">
    🔄 Refresh Bookings
</button>

        <div id="bookingsList">
            <p>Loading bookings...</p>
        </div>

    </div>

    <script>
        async function loadBookings() {

            try {

                const response = await fetch(
                    "https://bubbles-car-spa.onrender.com/bookings"
                );

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message);
                }

                const data = result.bookings;
                document.getElementById("bookingCount").textContent =
    `Total Bookings: ${data.length}`;

                const bookingsList =
                    document.getElementById("bookingsList");

                if (data.length === 0) {

                    bookingsList.innerHTML =
                        "<div class='empty'><p>No bookings yet.</p></div>";

                    return;
                }

                bookingsList.innerHTML = data.map(booking => `
                    <div class="booking">

                        <p>
                            <strong>👤 Name:</strong>
                            ${booking.customer_name}
                        </p>

                        <p>
                            <strong>📱 Phone:</strong>
                            ${booking.phone}
                        </p>

                        <p>
                            <strong>🚗 Car:</strong>
                            ${booking.car_type}
                        </p>

                        <p>
                            <strong>💦 Service:</strong>
                            ${booking.service}
                        </p>

                        <p>
                            <strong>📅 Date:</strong>
                            ${booking.date}
                        </p>

                        <p>
                            <strong>⏰ Time:</strong>
                            ${booking.time}
                        </p>

                        <p>
                            <strong>📍 Address:</strong>
                            ${booking.address}
                        </p>

                        <p>
                            <strong>💳 Payment:</strong>
                            ${booking.payment}
                        </p>

                    </div>
                `).join("");

            } catch (error) {

                console.error("Booking fetch error:", error);

                document.getElementById("bookingsList").innerHTML =
                    `<div class="empty">
                        <p style="color:red;">
                            ❌ ${error.message}
                        </p>
                    </div>`;
            }
        }

        loadBookings();
    </script>

</body>

</html>
